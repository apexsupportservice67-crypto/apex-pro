<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="apex-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffa3" />
      <stop offset="50%" stop-color="#00dc82" />
      <stop offset="100%" stop-color="#00b0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00ffa3" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base background container -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="#08080c" stroke="url(#apex-gradient)" stroke-width="3" filter="url(#glow)" />

  <!-- Activity pulse icon -->
  <g transform="translate(14, 14) scale(1.5)" stroke="#00ffa3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
  </g>
</svg>
